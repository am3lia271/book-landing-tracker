<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lending Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-8">
        <header class="text-center">
            <h1 class="text-3xl font-bold text-indigo-600">Book Lending Tracker</h1>
            <p class="text-gray-600">Track and manage your lent books efficiently.</p>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Total Loans</p>
                    <p id="total-loans" class="text-2xl font-bold text-gray-800">0</p>
                </div>
                <div class="p-3 bg-indigo-50 rounded-lg text-indigo-600 font-bold">📚</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-500 font-medium">Overdue Loans</p>
                    <p id="overdue-loans" class="text-2xl font-bold text-red-600">0</p>
                </div>
                <div class="p-3 bg-red-50 rounded-lg text-red-600 font-bold">⚠️</div>
            </div>
        </section>

        <section class="bg-white p-6 rounded-xl shadow border border-gray-100">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Add New Loan</h2>
            <form id="book-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Title (required)</label>
                    <input type="text" id="title" required class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Author (required)</label>
                    <input type="text" id="author" required class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Borrower (required)</label>
                    <input type="text" id="borrower" required class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Due Date (required)</label>
                    <input type="date" id="dueDate" required class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Genre (required)</label>
                    <input type="text" id="genre" required class="mt-1 block w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 px-4 rounded-md hover:bg-indigo-700 transition">Add Loan</button>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100">
                <h2 class="text-xl font-semibold text-gray-800">Lent Books List</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider">
                            <th class="p-3 border-b">Title</th>
                            <th class="p-3 border-b">Author</th>
                            <th class="p-3 border-b">Borrower</th>
                            <th class="p-3 border-b">Due Date</th>
                            <th class="p-3 border-b">Genre</th>
                            <th class="p-3 border-b">Status</th>
                            <th class="p-3 border-b">Action</th>
                        </tr>
                    </thead>
                    <tbody id="book-table-body" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
